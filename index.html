<!DOCTYPE html>
<html lang="vi">
<head><style>@page{margin:0!important;size:A4}@media print{html,body{margin:0!important;padding:0!important;width:100%!important}#printArea{display:block!important;position:static!important;visibility:visible!important;margin:0!important;padding:10mm 12mm!important;box-sizing:border-box;width:100%!important;min-height:auto!important}}
.dx-kpi{transition:transform .18s ease, box-shadow .18s ease; border-radius:14px!important; box-shadow:0 1px 3px rgba(16,42,32,.06), 0 1px 2px rgba(16,42,32,.04)!important; border:1px solid rgba(16,42,32,.06)!important}
.dx-kpi:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(16,42,32,.10), 0 4px 8px rgba(16,42,32,.06)!important}
.dx-kpi .v{letter-spacing:-.5px;white-space:nowrap!important;display:inline-block;max-width:100%;font-size:clamp(13px,1.42vw,20px)!important;line-height:1.2}
.dx-kpi{overflow:visible!important}
.dx-ico{width:34px!important;height:34px!important;font-size:16px!important;flex-shrink:0}
@media(max-width:1150px){.dx-kpis{grid-template-columns:repeat(3,1fr)!important}}
@media(max-width:720px){.dx-kpis{grid-template-columns:repeat(2,1fr)!important}}
.dash-sec{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.dash-sec span{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.7px}
.dash-sec i{display:inline-block;width:26px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--accent))}
.dash-sec .sp{flex:1;height:1px;background:linear-gradient(90deg,rgba(16,42,32,.12),transparent)}
.top-bar{height:6px;border-radius:3px;background:linear-gradient(90deg,#0f766e,#16a34a);margin-top:5px;opacity:.85}
.top-row{padding:10px 2px;border-bottom:1px dashed var(--border)}
.top-row:last-child{border-bottom:none}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

<title>LIONCHEM - Quản Lý Kho (Offline)</title>
<style>
/* ============ RESET & BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a7a5c; --primary-dark:#125c45; --primary-soft:#e6f2ee;
  --accent:#e8a33d; --accent-dark:#c98620; --accent-soft:#fdf3e3;
  --danger:#dc2626; --danger-soft:#fde8e8; --warn:#d97706; --warn-soft:#fef3e2;
  --ok:#059669; --ok-soft:#e6f6ef; --info:#2563eb; --info-soft:#e8effd;
  --bg:#f4f6f5; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --border:#e2e8e5;
  --shadow:0 1px 3px rgba(16,42,32,.08),0 1px 2px rgba(16,42,32,.04);
  --shadow-lg:0 10px 30px rgba(16,42,32,.12);
  --radius:10px; --sidebar-w:240px;
}
html,body{height:100%}
body{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:var(--primary);text-decoration:none}
h1,h2,h3,h4{font-weight:700;color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#c5cfcb;border-radius:4px}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#125c45,#0e4a38);color:#d7e8e1;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50;transition:transform .25s}
.sidebar .brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#c97a1a);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;letter-spacing:.5px;flex-shrink:0}
.brand-name{font-weight:800;font-size:15px;color:#fff;letter-spacing:.3px;line-height:1.15}
.brand-sub{font-size:10.5px;color:#8fb8aa;letter-spacing:.4px;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:10px 10px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:#b9d4ca;font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;transition:all .15s;width:100%;text-align:left}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--accent);color:#1a2b24;font-weight:700;box-shadow:0 4px 12px rgba(232,163,61,.35)}
.nav-item.active svg{opacity:1}
.nav-sep{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#6d9488;padding:14px 12px 6px}
.sidebar-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7fa89a}
.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.menu-toggle{display:none;background:var(--primary-soft);color:var(--primary);width:38px;height:38px;border-radius:8px;align-items:center;justify-content:center}
.topbar-title{font-size:17px;font-weight:800;color:var(--primary-dark);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.global-search{position:relative;max-width:340px;width:100%}
.global-search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border);border-radius:8px;background:#fafbfa;outline:none;transition:border .15s}
.global-search input:focus{border-color:var(--primary);background:#fff}
.global-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.topbar-actions{display:flex;gap:8px}
.content{padding:20px;flex:1;max-width:1400px;width:100%;margin:0 auto}
.view{display:none}.view.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ COMPONENTS ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:800;color:var(--primary-dark);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-title .sub{font-size:12px;font-weight:500;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13.5px;transition:all .15s;border:1px solid transparent;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-accent{background:var(--accent);color:#3a2a08;font-weight:700}
.btn-accent:hover{background:var(--accent-dark);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-soft{background:var(--primary-soft);color:var(--primary-dark)}
.btn-soft:hover{background:#d4e8e0}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge-ok{background:var(--ok-soft);color:var(--ok)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-muted{background:#f0f2f1;color:var(--muted)}
.badge-dark{background:#374151;color:#fff}
.kd{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:4px;margin-right:5px;vertical-align:1px}.kd-p{background:#dcfce7;color:#166534}.kd-m{background:#e0f2fe;color:#075985}
.st-tile.on{outline:2px solid var(--primary);background:var(--primary-soft)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.stat-card.accent::before{background:var(--accent)}.stat-card.danger::before{background:var(--danger)}.stat-card.info::before{background:var(--info)}
.stat-label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.stat-value{font-size:22px;font-weight:800;color:var(--text);margin-top:4px;font-variant-numeric:tabular-nums}
.stat-sub{font-size:11.5px;color:var(--muted);margin-top:2px}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:#fff}
table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
table.data th{background:#f0f4f2;color:var(--primary-dark);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.3px;padding:10px 10px;text-align:left;position:sticky;top:0;white-space:nowrap;border-bottom:2px solid var(--border)}
table.data td{padding:9px 10px;border-bottom:1px solid #eef1ef;vertical-align:middle}
table.data tr:last-child td{border-bottom:none}
table.data th.num{text-align:right}table.data th.c,table.data td.c{text-align:center}
table.data.fix{table-layout:fixed;min-width:900px}table.data.fix th{white-space:normal;line-height:1.25;vertical-align:middle;padding:10px 8px}table.data.fix td{padding:9px 8px}
table.data.fix td.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}table.data.fix td.num,table.data.fix td.c{white-space:nowrap}
table.data.fix input{max-width:100%;min-width:0!important;box-sizing:border-box}table.data.fix td.act{text-align:right;white-space:nowrap}
.sl-bar{height:8px;border-radius:4px;background:var(--primary-soft);overflow:hidden;flex:1}.sl-bar>i{display:block;height:100%;background:var(--primary);border-radius:4px}
.sl-prog{height:14px;border-radius:7px;background:#e8eeea;overflow:hidden}.sl-prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:7px}
table.data tbody tr:hover{background:#f7faf8}
table.data tfoot td{background:#f0f4f2;font-weight:800;border-top:2px solid var(--border)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.center{text-align:center}
.ellipsis{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--border);border-radius:7px;background:#fff;outline:none;width:100%;transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field input.err{border-color:var(--danger);background:var(--danger-soft)}
.field .hint{font-size:11px;color:var(--muted)}
.section-title{font-size:13px;font-weight:800;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--primary-soft);display:flex;align-items:center;gap:8px}

/* autocomplete dropdown */
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);max-height:340px;overflow-y:auto;z-index:100;display:none;margin-top:4px}
.ac-list.open{display:block}
.ac-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f1f4f2;font-size:13px}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.hl{background:var(--primary-soft)}
.ac-item .ac-code{font-weight:800;color:var(--primary-dark)}
.ac-item .ac-name{color:var(--muted);font-size:12px;margin-left:6px}
.ac-item .ac-stock{float:right;font-size:11.5px;color:var(--muted)}

/* filter chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 13px;border-radius:99px;background:#fff;border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .spacer{flex:1}
input.search-input{padding:8px 12px;border:1px solid var(--border);border-radius:7px;outline:none;min-width:200px;background:#fff}
input.search-input:focus{border-color:var(--primary)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,35,28,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;animation:popIn .2s ease}
.modal.wide{max-width:1080px;width:94vw}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:5;border-radius:14px 14px 0 0}
.modal-head h3{font-size:16px;color:var(--primary-dark)}
.modal-close{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal-close:hover{background:#f3f5f4;color:var(--danger)}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:#fff;border-radius:0 0 14px 14px}

/* toast */
.toasts{position:fixed;top:16px;right:16px;z-index:500;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border-left:4px solid var(--ok);box-shadow:var(--shadow-lg);padding:12px 18px;border-radius:8px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;min-width:240px;animation:slideIn .25s ease}
.toast.err{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--warn)}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* receipt items table in form */
.items-table{width:100%;border-collapse:collapse;font-size:13px}
.items-table th{background:#f0f4f2;padding:8px 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--primary-dark);text-align:left;border-bottom:2px solid var(--border)}
.items-table td{padding:5px 4px;border-bottom:1px solid #eef1ef;vertical-align:top}
.items-table input,.items-table select{padding:7px 8px;border:1px solid var(--border);border-radius:6px;width:100%;font-size:13px;outline:none}
.items-table input:focus{border-color:var(--primary)}
.items-table .row-err{background:var(--danger-soft)!important}
.stock-hint{font-size:10.5px;color:var(--muted);margin-top:2px}
.stock-hint.low{color:var(--warn);font-weight:700}.stock-hint.neg{color:var(--danger);font-weight:700}
.icon-btn{width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s}
.icon-btn:hover{background:var(--danger-soft);color:var(--danger)}
.icon-btn.edit:hover{background:var(--primary-soft);color:var(--primary)}
.total-box{background:var(--primary-soft);border:1px solid #c8e0d6;border-radius:8px;padding:12px 16px;margin-top:12px;display:flex;justify-content:flex-end;gap:30px;flex-wrap:wrap}
.total-box .t-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}
.total-box .t-value{font-size:20px;font-weight:800;color:var(--primary-dark);font-variant-numeric:tabular-nums}
.in-words{font-style:italic;color:var(--primary-dark);font-size:13px;margin-top:6px;text-align:right;font-weight:600}

/* alert banner */
.alert{padding:11px 14px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.alert-danger{background:var(--danger-soft);color:#991b1b;border:1px solid #f5c6c6}
.alert-warn{background:var(--warn-soft);color:#92400e;border:1px solid #f5deb3}
.alert-ok{background:var(--ok-soft);color:#065f46;border:1px solid #b7e0d0}
.alert-info{background:var(--info-soft);color:#1e40af;border:1px solid #c7d7f5}

/* chart */
.chart-bar{display:flex;align-items:flex-end;gap:10px;height:180px;padding:10px 4px 0;border-bottom:2px solid var(--border)}
.chart-bar .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.chart-bar .bar-wrap{width:100%;max-width:38px;height:140px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.chart-bar .bar{width:100%;border-radius:4px 4px 0 0;transition:height .4s ease;min-height:2px}
.bar.in{background:var(--primary)}.bar.out{background:var(--accent)}
.chart-bar .lbl{font-size:10.5px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;font-weight:600}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* bottom nav mobile */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:60;box-shadow:0 -2px 10px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav-inner{display:flex;overflow-x:auto}
.bn-item{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;font-size:9.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.bn-item svg{width:20px;height:20px}
.bn-item.active{color:var(--primary)}
.bn-item.active svg{stroke:var(--primary);stroke-width:2.4}

/* ============ PRINT ============ */
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:12mm;margin:0;box-sizing:border-box}
  .app,.toasts,.modal-overlay{display:none!important}
  @page{size:A4;margin:0}
}
.phieu{font-family:'Times New Roman',serif;color:#000;font-size:12.5px;line-height:1.4}
.phieu .p-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
.phieu .p-company{flex:1}
.phieu .p-company .cn{font-size:15px;font-weight:bold;text-transform:uppercase}
.phieu .p-company .tax{font-size:11.5px}
.phieu .p-logo{width:60px;height:60px;border:1px solid #999;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;text-align:center;margin-left:14px;flex-shrink:0;overflow:hidden}
.phieu .p-logo img{max-width:100%;max-height:100%}
.phieu h2.p-title{text-align:center;font-size:20px;font-weight:bold;text-transform:uppercase;margin:6px 0 2px;letter-spacing:1px}
.phieu .p-subtitle{text-align:center;font-size:13px;margin-bottom:10px;font-style:italic}
.phieu .p-meta{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12.5px}
.phieu .p-info{border:1px solid #000;padding:8px 10px;margin-bottom:8px;font-size:12.5px}
.phieu .p-info table{width:100%;border-collapse:collapse}
.phieu .p-info td{padding:2px 4px;vertical-align:top}
.phieu .p-info td.lbl{font-weight:bold;width:110px;white-space:nowrap}
.phieu table.p-items{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px}
.phieu table.p-items th{border:1px solid #000;background:#e8e8e8;padding:5px 4px;text-align:center;font-weight:bold;font-size:11.5px}
.phieu table.p-items td{border:1px solid #000;padding:4px 5px;vertical-align:top}
.phieu table.p-items td.num{text-align:right}
.phieu table.p-items td.ctr{text-align:center}
.phieu .p-total{display:flex;justify-content:space-between;align-items:flex-start;margin:8px 0 4px;font-size:13px}

    data.forEach(function(x,i){var cx=pl+gw*i+gw/2,ha=(H-pb-pt)*x.a/mx,hb=(H-pb-pt)*x.b/mx;
      o+='<rect x="'+(cx-bw-1)+'" y="'+(H-pb-ha)+'" width="'+bw+'" height="'+ha+'" rx="3" fill="var(--primary)"/><rect x="'+(cx+1)+'" y="'+(H-pb-hb)+'" width="'+bw+'" height="'+hb+'" rx="3" fill="var(--accent)"/>';
      if(lab&&x.a)o+=tx(cx-bw/2-1,H-pb-ha-4,x.a);
      if(lab&&x.b)o+=tx(cx+bw/2+1,H-pb-hb-4,x.b);
      o+='<text x="'+cx+'" y="'+(H-8)+'" font-size="11" text-anchor="middle" fill="var(--text)">'+U.esc(x.l)+'</text>'});
    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto"><line x1="0" y1="'+(H-pb)+'" x2="'+W+'" y2="'+(H-pb)+'" stroke="var(--border)"/>'+o+'</svg>'},
  stripTitle:function(n){return String(n||'').trim().replace(/^(anh|chị|chi|cô|co|chú|chu|bác|bac|em|ông|ong|bà|ba)\s+/i,'').toLowerCase()},
  locOf:function(r){var wl=(App.data.settings.warehouseLocation||'Hà Nội');return (r.location&&r.location!==r.transporter&&r.location.indexOf('Xe ')!==0)?r.location:wl},
  unitOf:function(it){
    var f=(it&&it.code&&window.App&&App.data)?App.findItem(it.code):null;
    var kind=(f&&f.kind)||(it&&it.kind);
    if(kind==='material') return String((f&&f.unit)||(it&&it.unit)||'').trim().toLowerCase()||'cái';
    var u=String((f&&f.unit)||(it&&it.unit)||'').trim().toLowerCase();
    if(u==='gói'||u==='chai') return u;
    var pk=String((f&&f.packaging)||(it&&it.packaging)||'').toLowerCase();
    return pk.indexOf('gói')>=0?'gói':'chai';
  },
  casesText:function(qty,qpc,unit){
    qty=Number(qty)||0;
    if(!qpc||qpc<=0) return U.fmt(qty)+(unit?' '+unit:'');
    var k=Math.floor(qty/qpc), r=qty%qpc;
    if(k>0&&r>0) return U.fmt(k)+' kiện + '+U.fmt(r)+' '+(unit||'đơn vị');
    if(k>0) return U.fmt(k)+' kiện';
    return U.fmt(r)+' '+(unit||'đơn vị');
  },
  uid:function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
  toast:function(msg,type){
    var t=document.createElement('div');t.className='toast'+(type?' '+type:'');
    t.innerHTML=(type==='err'?'⚠ ':(type==='warn'?'⚠ ':'✓ '))+U.esc(msg);
    document.getElementById('toasts').appendChild(t);
    setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(function(){t.remove()},300)},2800);
  },
  confirm:function(title,body,okLabel,danger){
    return new Promise(function(res){
      App.openModal(title,'<p style="font-size:14px">'+U.esc(body)+'</p>',[
        {label:'Hủy',cls:'btn-ghost',onclick:function(){App.closeModal();res(false)}},
        {label:okLabel||'Xác nhận',cls:danger?'btn-danger':'btn-primary',onclick:function(){App.closeModal();res(true)}}
      ]);
    });
  }
};

/* ---------- Vietnamese number to words ---------- */
var NumWords=(function(){
  var digit=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  function read3(n){
    var tr=Math.floor(n/100), ch=Math.floor((n%100)/10), dv=n%10, s='';
    if(tr){s+=digit[tr]+' trăm';if(ch===0&&dv) s+=' lẻ';}
    if(ch>1) s+=(tr?' ':'')+digit[ch]+' mươi';
    else if(ch===1) s+=(tr?' ':'')+'mười';
    if(dv){
      if(ch===0&&tr) s+=' '+(dv===1?'mốt':digit[dv]);
      else if(ch>1&&dv===1) s+=' mốt';
      else if(ch>=1&&dv===5) s+=' lăm';
      else s+=(ch?' ':'')+digit[dv];
    }
    return s.trim();
  }
  return function(n){
    n=Math.round(Math.abs(n||0));
    if(n===0) return 'Không đồng';
    var groups=[], i=0;
    while(n>0||i===0){groups.unshift(n%1000);n=Math.floor(n/1000);i++;}
    var unit=['','nghìn','triệu','tỷ','nghìn tỷ','triệu tỷ'], out=[];
    groups.forEach(function(g,idx){
      if(g===0){if(out.length&&idx<groups.length-1&&groups[idx+1]) out.push('tỷ'.indexOf(unit[groups.length-1-idx])>=0?unit[groups.length-1-idx]:'');return;}
      var part=read3(g);
      if(idx>0&&g<100) part='không trăm '+(g<10?'lẻ ':'')+part;
      var u=unit[groups.length-1-idx];
      out.push(part+(u?' '+u:''));
    });
    var s=out.filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
    return s.charAt(0).toUpperCase()+s.slice(1)+' đồng';
  };
})();

    });

/* ---------- Autocomplete (body-level dropdown, no clipping) ---------- */
var _acEl=null,_acTarget=null,_acItems=[],_acHl=-1,_acOnSelect=null,_acKeepOpen=false;
function acEnsure(){
  if(_acEl)return _acEl;
  _acEl=document.createElement('div');
  _acEl.id='acDropdown';
  _acEl.style.cssText='position:fixed;z-index:9999;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 30px rgba(16,42,32,.18);max-height:420px;overflow-y:auto;overscroll-behavior:contain;display:none;min-width:240px;font-size:13px';
  _acEl.addEventListener('mousedown',function(e){_acKeepOpen=true;e.preventDefault()});
  _acEl.addEventListener('mouseup',function(){setTimeout(function(){_acKeepOpen=false},300)});
  document.body.appendChild(_acEl);
  _acEl.addEventListener('wheel',function(e){e.preventDefault();_acEl.scrollTop+=e.deltaY;},{passive:false});
  document.addEventListener('mousedown',function(e){
    if(!_acEl||_acEl.style.display==='none')return;
    if(e.target.closest&&e.target.closest('#acDropdown'))return;
    if(e.target.hasAttribute&&e.target.hasAttribute('data-ac'))return;
    acHide();
  });
  return _acEl;
}
function acShow(input,items,onSelect){

function renderStock(c,kindPreset){

  var sortKey=S.sortKey||'def',searchTimer=null,ed=null,stockMap={},moveMap={};
  function esc(v){return U.esc(v==null?'':String(v))}

  function usedInHistory(p){return App.data.receipts.some(function(r){return !r.cancelled&&(r.items||[]).some(function(it){return it.code===p.code})})}
  function caseCell(p,st){if(p.kind==='material')return U.fmt(st.stock)+' '+esc(U.unitOf(p));return p.quantityPerCase?U.casesText(st.stock,p.quantityPerCase,p.unit):'—'}
  function caseStyle(){return 'font-size:'+(S.caseSize||15)+'px;font-weight:800;color:var(--primary-dark)'}

window.exportItems=function(kind){
  var isP=kind==='product', items=isP?App.data.products:App.data.materials;
  var rows=[['Mã','Tên','Quy cách','Đơn vị','Định mức/kiện','Đơn giá mặc định','Tồn tối thiểu','Tồn đầu','Ghi chú']];
  items.forEach(function(p){rows.push([p.code,p.name,p.packaging,p.unit,p.quantityPerCase,p.defaultPrice,p.minStock,p.openingStock,p.note])});
  App.exportCSV((isP?'san_pham':'vat_tu')+'_'+U.today()+'.csv',rows);
  U.toast('Đã export '+items.length+' dòng');
};
window.importCSV=function(kind){
  var isP=kind==='product', store=isP?'products':'materials';
  App.openModal('Import từ CSV/Excel','<p style="margin-bottom:10px;font-size:13px">Dán nội dung từ Excel (các cột cách nhau bằng dấu tab) hoặc chọn file CSV. Cột: <strong>Mã | Tên | Quy cách | Đơn vị | Định mức/kiện | Đơn giá | Tồn tối thiểu | Tồn đầu | Ghi chú</strong></p><textarea id="csvPaste" rows="8" style="width:100%;border:1px solid var(--border);border-radius:7px;padding:8px;font-family:monospace;font-size:12px" placeholder="Mã SP&#9;Tên SP&#9;Quy cách..."></textarea><input type="file" id="csvFile" accept=".csv,.txt" style="margin-top:8px">',[
    {label:'Hủy',cls:'btn-ghost',onclick:App.closeModal},
    {label:'Nhập dữ liệu',cls:'btn-primary',onclick:async function(){
      var txt=document.getElementById('csvPaste').value;
      var f=document.getElementById('csvFile').files[0];
      if(f){txt=await f.text()}
      var lines=txt.split(/\r?\n/).filter(function(l){return l.trim()});
      var added=0, storeArr=isP?App.data.products:App.data.materials;
      for(var i=0;i<lines.length;i++){
        var cols=lines[i].split(/\t|,/).map(function(x){return x.trim()});
        if(!cols[0]||/mã/i.test(cols[0])) continue;
        var exist=storeArr.find(function(p){return p.code===cols[0]});
        var obj={code:cols[0],name:cols[1]||'',packaging:cols[2]||'',unit:cols[3]||'',quantityPerCase:Number(cols[4])||0,defaultPrice:Number(String(cols[5]||'').replace(/[^\d]/g,''))||0,minStock:Number(cols[6])||0,openingStock:Number(cols[7])||0,note:cols[8]||''};
        if(exist) Object.assign(exist,obj), await DB.put(store,exist);
        else {var r=await DB.put(store,obj);obj.id=r;storeArr.push(obj);added++}
      }
      App.closeModal();U.toast('Đã nhập '+lines.length+' dòng, thêm mới '+added);App.go('inventory');
    }}
  ]);
  setTimeout(function(){var f=document.getElementById('csvFile');if(f)f.onchange=async function(){var t=await f.files[0].text();document.getElementById('csvPaste').value=t}},50);
};

        var trs=document.querySelectorAll('#bulkTable tbody tr'), saved=0;

window.delItem=async function(kind,id){
  var isP=kind==='product', store=isP?'products':'materials', arr=isP?App.data.products:App.data.materials;
  var p=arr.find(function(x){return x.id===id});if(!p)return;
  var used=App.data.receipts.some(function(r){return !r.cancelled&&(r.items||[]).some(function(it){return it.code===p.code})});
  if(used){
    var ok=await U.confirm('Không thể xóa hoàn toàn','Mã "'+p.code+'" đã có lịch sử giao dịch. Bạn có thể đánh dấu NGỪNG SỬ DỤNG (vẫn giữ lịch sử) thay vì xóa. Tiếp tục đánh dấu ngừng sử dụng?','Đánh dấu ngừng SD',true);
    if(ok){p.discontinued=true;await DB.put(store,p);U.toast('Đã đánh dấu ngừng sử dụng', 'warn');App.go('inventory')}
    return;
  }
  if(await U.confirm('Xóa '+ (isP?'sản phẩm':'vật tư'),'Xóa "'+p.code+'"? Thao tác không thể hoàn tác.','Xóa',true)){
    await DB.del(store,id);App.data[isP?'products':'materials']=arr.filter(function(x){return x.id!==id});U.toast('Đã xóa');App.go('inventory');
  }
};

var receiptState=null;
function renderReceipt(c, type, prefill){
  var isIn=type==='in';
  receiptState=prefill||{type:type,date:U.today(),partnerName:'',partnerPhone:'',partnerAddress:'',warehouse:App.data.settings.defaultWarehouse,location:App.data.settings.warehouseLocation||'Hà Nội',reason:isIn?(App.data.settings.inReason||'Nhập hàng về kho'):(App.data.settings.outReason||'Bán thành phẩm'),note:App.data.settings.defaultNote||'',voucherNo:'',paidAmount:0,transporter:'',items:[{code:'',name:'',quantity:1,unitPrice:0,cases:0,note:''}],editingId:null};
  var st=receiptState;
  var _oldRc=st.editingId?App.data.receipts.find(function(r){return r.id===st.editingId}):null;
  function _oldQty(code){if(!_oldRc)return 0;var q=0;(_oldRc.items||[]).forEach(function(it){if(it.code===code)q+=Number(it.quantity)||0});return q}
  if(!st.location||st.location===st.transporter||String(st.location).indexOf('Xe ')===0) st.location=App.data.settings.warehouseLocation||'Hà Nội';
  function itemRow(it,i){
    var stk=it.code?App.stockOf(it.code).stock+(st.editingId?_oldQty(it.code):0):null;
    var over=(!isIn&&stk!==null&&Number(it.quantity)>stk);
    var kind=it.code?(App.findItem(it.code)||{}).kind:null;
    return '<tr class="'+(over?'row-err':'')+'" data-i="'+i+'">'+
      '<td class="ctr">'+(i+1)+'</td>'+
      '<td style="min-width:120px"><div class="ac-wrap"><input data-f="code" value="'+U.esc(it.code)+'" placeholder="Mã SP / VT..." autocomplete="off"></div></td>'+
      '<td style="min-width:180px"><input data-f="name" value="'+U.esc(it.name||'')+'" readonly style="background:#f7faf8">'+(kind?'<span class="badge '+(kind==='material'?'badge-info':'badge-ok')+'" style="margin-left:6px;font-size:10px">'+(kind==='material'?'VẬT TƯ':'SẢN PHẨM')+'</span>':'')+(stk!==null?'<div class="stock-hint '+(stk<0?'neg':(over?'neg':''))+'">Tồn: '+U.fmt(stk)+' '+U.esc(U.unitOf(it))+(over?' ⚠ VƯỢT TỒN':'')+'</div>':'')+'</td>'+
      '<td style="min-width:100px"><input data-f="packaging" value="'+U.esc(it.packaging||'')+'" readonly style="background:#f7faf8"></td>'+
      '<td style="width:95px"><input data-f="quantity" type="number" min="0" value="'+it.quantity+'">'+(it.code?'<div style="font-size:11px;color:#6b7a73;margin-top:2px;text-align:center">'+U.esc(U.unitOf(it))+'</div>':'')+'</td>'+
      '<td style="width:100px">'+(kind==='material'&&App.data.settings.materialPrice===false?'<span style="color:#9aa5a0">—</span>':'<input data-f="unitPrice" type="number" min="0" value="'+it.unitPrice+'">')+'</td>'+
      '<td class="num" style="width:105px;font-weight:700">'+U.money((Number(it.quantity)||0)*(Number(it.unitPrice)||0))+'</td>'+
      '<td style="width:85px">'+((it.code&&((it.kind||(App.findItem(it.code)||{}).kind)==='material'||!(it.quantityPerCase||(App.findItem(it.code)||{}).quantityPerCase)))?'<span style="color:#aaa">—</span>':'<input data-f="cases" type="number" min="0" step="any" value="'+(it.cases||0)+'" placeholder="tự nhập">')+'</td>'+
      '<td style="width:110px"><input data-f="note" value="'+U.esc(it.note||'')+'"></td>'+
      '<td><button class="icon-btn" onclick="removeItem('+i+')">✕</button></td></tr>';
  }

App.exportInventory=function(){
  var rows=[['Mã','Tên','Quy cách','Đơn vị','Tồn đầu','Tổng nhập','Tổng xuất','Tồn cuối','Số kiện','Đơn giá','Giá trị tồn']];
  App.allItems().forEach(function(p){var st=App.stockOf(p.code);rows.push([p.code,p.name,p.packaging,p.unit,st.open,st.in,st.out,st.stock,(p.kind==='material'?U.fmt(st.stock)+' '+U.unitOf(p):U.casesText(st.stock,p.quantityPerCase,p.unit)),p.defaultPrice,st.stock*(Number(p.defaultPrice)||0)])});
  App.exportCSV('ton_kho_'+U.today()+'.csv',rows);U.toast('Đã xuất báo cáo tồn kho');
};
App.reconcile=function(){
  var diffs=[],seen={},dup=[];
  App.allItems().forEach(function(p){if(seen[p.code]){if(dup.indexOf(p.code)<0)dup.push(p.code)}seen[p.code]=1});
  var unknown={};
  App.data.receipts.forEach(function(r){if(r.cancelled)return;(r.items||[]).forEach(function(it){if(it.code&&!App.findItem(it.code))unknown[it.code]=1})});
  var uk=Object.keys(unknown);
  App.allItems().forEach(function(p){var st=App.stockOf(p.code);var recalc=st.open+st.in-st.out;if(Math.abs(recalc-st.stock)>0.001)diffs.push(p.code+': lệch '+(recalc-st.stock))});
  var msg='';
  if(diffs.length)msg+='<div class="alert alert-danger">Lệch số liệu ('+diffs.length+' mã): '+diffs.join(', ')+'</div>';
  if(dup.length)msg+='<div class="alert alert-warn" style="margin-top:8px"><strong>Trùng mã giữa Sản phẩm & Vật tư ('+dup.length+'):</strong> '+dup.join(', ')+'<br>Trùng mã gây sai tồn kho và sai đối soát. Nên đổi/gộp mã cho trùng khớp.</div>';
  if(uk.length)msg+='<div class="alert alert-warn" style="margin-top:8px"><strong>Phiếu chứa mã không có trong danh mục ('+uk.length+'):</strong> '+uk.join(', ')+'<br>Các mã này không tính vào tồn. Cần thêm vào danh mục hoặc sửa mã trong phiếu.</div>';
  if(!msg)msg='<div class="alert alert-ok">Tồn kho KHỚP hoàn toàn. Không trùng mã, không có mã lạ trong phiếu.</div>';
  App.openModal('Kết quả đối soát tồn kho',msg+'<p style="font-size:13px;color:var(--muted);margin-top:10px">Đã kiểm tra '+App.allItems().length+' mã, '+App.data.receipts.length+' phiếu.</p>',[{label:'Đóng',cls:'btn-primary',onclick:App.closeModal}]);
};

App.deleteReceipt=async function(id){
  var r=App.data.receipts.find(function(x){return x.id===id});if(!r)return;
  if(!r.cancelled){U.toast('Chỉ xóa được phiếu đã HỦY','err');return}
  var ok=await U.confirm('Xóa vĩnh viễn phiếu '+r.number,'Phiếu đã hủy sẽ bị xóa hoàn toàn. Không thể hoàn tác.');
  if(!ok)return;
  await DB.del('receipts',id);
  App.data.receipts=App.data.receipts.filter(function(x){return x.id!==id});
  U.toast('Đã xóa phiếu '+r.number);
  App.go('history');
};
App.deleteCancelled=async function(){
  var l=App.data.receipts.filter(function(r){return r.cancelled});if(!l.length)return;
  var ok=await U.confirm('Xóa '+l.length+' phiếu đã hủy','Tất cả phiếu đã hủy sẽ bị xóa vĩnh viễn, không thể hoàn tác.');if(!ok)return;
  for(var i=0;i<l.length;i++)await DB.del('receipts',l[i].id);
  App.data.receipts=App.data.receipts.filter(function(r){return !r.cancelled});
  U.toast('Đã xóa '+l.length+' phiếu đã hủy');App.go('history');

Views.sales=function(c){
  var s=App.data.settings,S={per:s.salesPer||'month',from:'',to:'',kind:'all',topBy:'amt',q:'',rs:'date-'};
  var PER=[['today','Hôm nay'],['week','Tuần này'],['month','Tháng này'],['prev','Tháng trước'],['quarter','Quý này'],['year','Năm nay'],['custom','Tùy chọn']];
  function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function pd(x){var p=x.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  function addD(x,n){var d=pd(x);d.setDate(d.getDate()+n);return ds(d)}
  function addM(x,n){var d=pd(x);d.setMonth(d.getMonth()+n);return ds(d)}
  function days(a,b){return Math.round((pd(b)-pd(a))/864e5)+1}
  function range(){var td=U.today(),d=pd(td),y=d.getFullYear(),m=d.getMonth(),f,t;
    if(S.per==='today'){f=t=td}else if(S.per==='week'){var wd=(d.getDay()+6)%7;f=addD(td,-wd);t=addD(f,6)}
    else if(S.per==='month'){f=ds(new Date(y,m,1));t=ds(new Date(y,m+1,0))}else if(S.per==='prev'){f=ds(new Date(y,m-1,1));t=ds(new Date(y,m,0))}
    else if(S.per==='quarter'){var q=Math.floor(m/3)*3;f=ds(new Date(y,q,1));t=ds(new Date(y,q+3,0))}else if(S.per==='year'){f=y+'-01-01';t=y+'-12-31'}
    else{f=S.from||td;t=S.to||td;if(t<f)t=f}
    var eff=t>td?td:t; if(eff<f)eff=f;
    var n=days(f,eff),pf,pt;
    if(S.per==='month'||S.per==='prev'){pf=addM(f,-1)}else if(S.per==='quarter'){pf=addM(f,-3)}else if(S.per==='year'){pf=addM(f,-12)}else{pf=addD(f,-days(f,t))}
    pt=addD(pf,n-1);return {f:f,t:t,eff:eff,pf:pf,pt:pt,n:n}}
  function build(f,t){
    var R={rev:0,cnt:0,paid:0,cus:{},items:{},kind:{product:0,material:0},dow:[0,0,0,0,0,0,0],byDay:{},byMonth:{},list:[]};

      R.rev+=amt;R.cnt++;R.paid+=paid;
      var k=App.dkey(r.partnerName)||'?',c=R.cus[k]||(R.cus[k]={key:k,name:r.partnerName||'(không tên)',rev:0,cnt:0,paid:0});c.rev+=amt;c.cnt++;c.paid+=paid;
      its.forEach(function(it){var a=Number(it.amount)||0,o=R.items[it.code]||(R.items[it.code]={code:it.code,name:it.name||it.code,amt:0,qty:0,unit:U.unitOf(it)});o.amt+=a;o.qty+=Number(it.quantity)||0;var fd=App.findItem(it.code);R.kind[fd&&fd.kind==='material'?'material':'product']+=a});
      R.dow[(pd(r.date).getDay()+6)%7]+=amt;R.byDay[r.date]=(R.byDay[r.date]||0)+amt;var mk=r.date.slice(0,7);R.byMonth[mk]=(R.byMonth[mk]||0)+amt;
      R.list.push({r:r,amt:amt,paid:paid});
    });return R}
  function delta(a,b){if(!b)return a?'<span class="up">mới</span>':'—';var q=Math.round((a-b)/b*100);return '<span class="'+(q>=0?'up':'down')+'">'+(q>=0?'▲ ':'▼ ')+Math.abs(q)+'%</span> so cùng kỳ trước'}
  function draw(){

Views.partners=function(c){
  var DM={}, tab=App._ptab||'customers', q=(function(){var v=(App._preP||'').toLowerCase();App._preP='';return v})(), ed=null;
  function arr(){return tab==='customers'?App.data.customers:App.data.suppliers}
  function inp(f,v,w){return '<input data-f="'+f+'" value="'+U.esc(v||'')+'" style="'+(w?'width:'+w+'px;':'width:100%;')+'padding:6px 8px;border:1px solid var(--primary);border-radius:6px;background:#fff">'}
  function row(p){
    var cu=tab==='customers';
    if(ed===p.id) return '<tr data-id="'+p.id+'" style="background:var(--primary-soft)"><td>'+inp('code',p.code,90)+'</td><td>'+inp('name',p.name)+'</td><td>'+inp('phone',p.phone)+'</td><td>'+inp('address',p.address)+'</td>'+(cu?'<td>'+inp('transporter',p.transporter||p.location)+'</td><td></td>':'')+'<td style="white-space:nowrap"><button class="btn btn-primary btn-sm" data-act="save">✓ Lưu</button> <button class="btn btn-ghost btn-sm" data-act="cancel">Hủy</button></td></tr>';
    return '<tr data-id="'+p.id+'"><td><strong>'+U.esc(p.code)+'</strong></td><td>'+U.esc(p.name)+'</td><td>'+U.esc(p.phone||'')+'</td><td class="ellipsis">'+U.esc(p.address||'')+'</td>'+(cu?'<td>'+U.esc(p.transporter||p.location||'')+'</td><td class="num">'+(function(){var o=DM[App.dkey(p.name)];return o&&Math.abs(o.balance)>=1?'<a href="#" data-act="debt" style="font-weight:700;color:'+(o.balance>0?'var(--danger)':'var(--ok)')+'">'+U.money(o.balance)+'</a>':'<span style="color:var(--muted)">—</span>'})()+'</td>':'')+'<td style="white-space:nowrap"><button class="icon-btn edit" title="Sửa ngay trên dòng" data-act="edit">✎</button> <button class="icon-btn" title="Xóa" data-act="del">✕</button></td></tr>'}
  function rows(){
    DM={};if(tab==='customers')App.debtData().forEach(function(o){DM[o.key]=o});
    var l=arr().filter(function(p){return !q||U.match(p.code+' '+p.name+' '+(p.phone||'')+' '+(p.address||'')+' '+(p.transporter||p.location||''),q)});
    document.getElementById('pBody').innerHTML=l.map(row).join('')||'<tr><td colspan="6" class="empty-state">Không tìm thấy.</td></tr>';
  }
  function draw(){
    var y=window.scrollY;
    c.innerHTML='<div class="card"><div class="card-title">'+(tab==='customers'?'Khách hàng':'Nhà cung cấp')+' <span class="sub">('+arr().length+')</span><div class="spacer" style="flex:1"></div><button class="btn btn-primary btn-sm" onclick="editPartner(\''+tab+'\')">+ Thêm</button></div>'+
    '<div class="chips"><button class="chip'+(tab==='customers'?' active':'')+'" data-t="customers">Khách hàng ('+App.data.customers.length+')</button><button class="chip'+(tab==='suppliers'?' active':'')+'" data-t="suppliers">Nhà cung cấp ('+App.data.suppliers.length+')</button></div>'+
    '<div class="toolbar"><input type="search" class="search-input" id="pSearch" placeholder="Tìm tên, mã, SĐT, địa chỉ, nhà xe... (không cần gõ dấu)" autocomplete="off"></div>'+
    '<div class="table-wrap"><table class="data" style="min-width:560px"><thead><tr><th>Mã</th><th>Tên</th><th>SĐT</th><th>Địa chỉ</th>'+(tab==='customers'?'<th>Nhà xe</th><th class="num">Công nợ</th>':'')+'<th></th></tr></thead><tbody id="pBody"></tbody></table></div></div>';
    rows();window.scrollTo(0,y);
    var s=document.getElementById('pSearch');s.value=q;s.oninput=function(){q=s.value.trim().toLowerCase();ed=null;rows()};
    c.querySelectorAll('.chip[data-t]').forEach(function(ch){ch.onclick=function(){tab=ch.dataset.t;App._ptab=tab;ed=null;q='';draw()}});
    var tb=document.getElementById('pBody');
    tb.onclick=async function(e){
      var b=e.target.closest('[data-act]');if(!b)return;
      var tr=b.closest('tr'),id=Number(tr.dataset.id),p=arr().find(function(x){return x.id===id});if(!p)return;
      var act=b.dataset.act;
      function swap(pp){tr.outerHTML=row(pp)}
      if(act==='edit'){
        if(ed!=null&&ed!==id){var old=arr().find(function(x){return x.id===ed}),otr=tb.querySelector('tr[data-id="'+ed+'"]');ed=null;if(old&&otr)otr.outerHTML=row(old)}
        ed=id;tr.outerHTML=row(p);var ntr=tb.querySelector('tr[data-id="'+id+'"]'),ni=ntr.querySelector('[data-f="name"]');ni.focus();ni.select();
      } else if(act==='debt'){e.preventDefault();App.debtLedger(App.dkey(p.name))}
      else if(act==='cancel'){ed=null;swap(p)}
      else if(act==='save'){
        var g=function(f){var el=tr.querySelector('[data-f="'+f+'"]');return el?el.value.trim():''};
        if(!g('name')){U.toast('Tên không được trống','err');return}
        p.code=g('code')||p.code;p.name=g('name');p.phone=g('phone');p.address=g('address');
        if(tab==='customers'){p.transporter=g('transporter');p.location=p.transporter}
        await DB.put(tab,p);ed=null;swap(p);U.toast('Đã lưu: '+p.name);
      } else if(act==='del'){
        if(!await U.confirm('Xóa đối tác','Xóa "'+p.name+'"? Lịch sử phiếu vẫn giữ nguyên.','Xóa',true))return;
        await DB.del(tab,id);App.data[tab]=App.data[tab].filter(function(x){return x.id!==id});U.toast('Đã xóa');draw();
      }
    };
    tb.onkeydown=function(e){if(!ed)return;var tr=e.target.closest('tr');if(!tr)return;if(e.key==='Enter'){e.preventDefault();var b=tr.querySelector('[data-act="save"]');if(b)b.click()}else if(e.key==='Escape'){var b2=tr.querySelector('[data-act="cancel"]');if(b2)b2.click()}};
  }
  draw();
};

  '<button class="btn btn-danger" onclick="App.clearAllData()">Xóa TOÀN BỘ dữ liệu (reset)</button></div>'+
  '<div class="card"><div class="card-title">Hướng dẫn nhanh</div><div style="font-size:13px;line-height:1.9">'+
    '1. Mở file này bằng Chrome/Edge/Safari (kép vào là chạy, không cần cài đặt).<br>'+
    '2. Lần đầu: vào <strong>Cài đặt</strong> điền thông tin công ty + logo.<br>'+
    '3. Kiểm tra danh sách <strong>Sản phẩm</strong> (đã nhập sẵn từ file Excel của bạn) — sửa đơn giá mặc định hàng loạt.<br>'+
    '4. Tạo phiếu <strong>Nhập kho</strong> để đưa hàng về đúng tồn (hoặc dùng Tồn đầu có sẵn).<br>'+
    '5. <strong>Xuất kho</strong> → chọn khách (tự điền SĐT/địa chỉ) → chọn mã SP (tự điền tên/giá) → nhập SL → Lưu & In.<br>'+
    '6. Định kỳ: <strong>Sao lưu dữ liệu</strong> tải file .json cất giữ. Đổi máy chỉ cần mở file + Khôi phục.<br>'+
    '7. Để cài như app (PWA): đặt file này trên GitHub Pages / Google Drive (public) → mở bằng điện thoại → "Thêm vào màn hình chính".'+
  '</div></div>';
};
App.doBackup=function(){App.data.settings.lastBackup=Date.now();DB.setSetting('lastBackup',Date.now());
  var payload={app:'LIONCHEM WMS',version:1,exportedAt:new Date().toISOString(),
    products:App.data.products,materials:App.data.materials,customers:App.data.customers,suppliers:App.data.suppliers,receipts:App.data.receipts,settings:App.data.settings};
  var blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lionchem_backup_'+U.today()+'.json';a.click();
  U.toast('Đã tải file sao lưu. Hãy cất giữ an toàn!');
};
App.doRestore=async function(){
  var f=document.getElementById('restoreFile').files[0];
  if(!f){U.toast('Chưa chọn file backup','err');return}
  var ok=await U.confirm('Khôi phục dữ liệu','Toàn bộ dữ liệu hiện tại sẽ bị ghi đè bằng dữ liệu trong file "'+f.name+'". Tiếp tục?','Khôi phục',true);
  if(!ok)return;
  try{
    var data=JSON.parse(await f.text());
    await DB.clear('products');await DB.clear('materials');await DB.clear('customers');await DB.clear('suppliers');await DB.clear('receipts');
    var stores=['products','materials','customers','suppliers','receipts'];
    for(var si=0;si<stores.length;si++){var arr=data[stores[si]]||[];for(var i=0;i<arr.length;i++){var o=arr[i];delete o.id;var r=await DB.put(stores[si],o);o.id=r}}
    if(data.settings){for(var k in data.settings){await DB.setSetting(k,data.settings[k])}}
    await App.loadAll();U.toast('Khôi phục thành công! Đã nạp '+data.products.length+' SP, '+(data.receipts||[]).length+' phiếu.');App.go('dashboard');
  }catch(e){U.toast('File backup không hợp lệ: '+e.message,'err')}
};
App.clearAllData=async function(){
  var ok=await U.confirm('Xóa toàn bộ dữ liệu','MỌI dữ liệu (sản phẩm, phiếu, khách hàng...) sẽ bị xóa vĩnh viễn. Hãy sao lưu trước. Gõ "XOA" để xác nhận?','Tôi đã sao lưu, XÓA HẾT',true);
  if(!ok)return;
  await DB.clear('products');await DB.clear('materials');await DB.clear('customers');await DB.clear('suppliers');await DB.clear('receipts');await DB.clear('meta');
  await App.loadAll();U.toast('Đã xóa toàn bộ dữ liệu','warn');App.go('dashboard');
};

/* ---------- SEED on first run ---------- */
async function seedIfEmpty(){
  var seeded=await DB.getMeta('seeded_v1');
  if(seeded) return;
  var i;
  for(i=0;i<SEED.products.length;i++){var r=await DB.put('products',SEED.products[i]);SEED.products[i].id=r}
  for(i=0;i<SEED.materials.length;i++){var r2=await DB.put('materials',SEED.materials[i]);SEED.materials[i].id=r2}
  for(i=0;i<SEED.suppliers.length;i++){var r3=await DB.put('suppliers',SEED.suppliers[i]);SEED.suppliers[i].id=r3}
  for(i=0;i<SEED.customers.length;i++){var r4=await DB.put('customers',SEED.customers[i]);SEED.customers[i].id=r4}
  await DB.setMeta('seeded_v1',true);
}
DB.open().then(function(){return seedIfEmpty()}).then(function(){App.init()}).catch(function(e){console.error('seed error',e);App.init()});

</script>
